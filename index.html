<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>F1 Campeonato</h1>
        <nav>
            <ul>
                &#x1F3C1
                <li>Campeonato</li>
                <li>Equipes</li>
                <li>Pilotos</li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="Lider">
            <h2>&#x1F3C6; Lider do Campeonato</h2>
            <p class="classificacao">Andrea Kimi Antonelli</p>
            <p id="team">Mercedes</p>
            <p class="nome">365 Pontos</p>
        </section>
        <section>
            <div class="tabela-container">
                <table>
                    <thead>
                        <p id="tabela">Classificação do Campeonato</p>
                        <tr>
                            <th>Pos.</th>
                            <th>Pilotos</th>
                            <th>Equipe</th>
                            <th>Pontos</th>
                        </tr>
                    </thead>
                    <tbody id="classificacao">
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
